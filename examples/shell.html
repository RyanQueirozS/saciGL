<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{{ TITLE }}}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
      }
      canvas {
        display: block;
        margin: 0 auto;
        background: #000;
      }
      .emscripten {
        padding: 0;
        margin: 0 auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas
      id="canvas"
      class="emscripten"
      oncontextmenu="event.preventDefault()"
    ></canvas>
    <script type="text/javascript">
      var Module = {
        canvas: (function () {
          var canvas = document.getElementById("canvas");
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          return canvas;
        })(),
        onRuntimeInitialized: function () {
          console.log("Emscripten runtime initialized");
        },
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
